[package]
name = "carbon-jetstreamer-datasource"
description = "Carbon Jetstreamer Datasource"
license = { workspace = true }
version = "1.0.0"
edition = { workspace = true }
readme = "README.md"
repository = { workspace = true }
keywords = ["solana", "indexer", "jetstreamer", "datasource"]
categories = ["encoding"]

[lib]
crate-type = ["rlib"]

[dependencies]
async-trait = { workspace = true }
carbon-core = { workspace = true }
futures-util = { workspace = true }
jetstreamer-firehose = "0.2.0"
# Jetstreamer 0.2 published with rseek 0.3 / reqwest 0.12. Pin the
# compatible resolver set so newer rseek 0.4 cannot introduce reqwest 0.13.
rseek = "=0.3.0"
reqwest = { workspace = true, features = ["stream"] }
solana-pubkey = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
